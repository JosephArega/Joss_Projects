# ---------------------------------------------------------------------------
# Sample nginx reverse proxy for the Information Desk.
#
#   cp deploy/nginx.conf /etc/nginx/sites-available/information-desk
#   ln -s /etc/nginx/sites-available/information-desk /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# HTTPS is not optional. The session cookie is issued with the Secure flag, so
# browsers will not send it back over plain http and the dashboard will appear
# to log you out on every request.
# ---------------------------------------------------------------------------

upstream information_desk {
    server 127.0.0.1:4000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name desk.example.org;

    # Everything except the ACME challenge goes to https.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name desk.example.org;

    ssl_certificate     /etc/letsencrypt/live/desk.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/desk.example.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # The Node process already sets CSP, X-Frame-Options and friends; nginx
    # does not duplicate them so there is a single place to change them.

    access_log /var/log/nginx/information-desk.access.log;
    error_log  /var/log/nginx/information-desk.error.log;

    client_max_body_size 1m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass         http://information_desk;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        # The app runs with `trust proxy = 1`, so exactly one hop is trusted
        # here. Do not add another proxy in front without raising that value.
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
    }

    # Content-hashed bundles are safe to cache hard; index.html must not be.
    location /assets/ {
        proxy_pass http://information_desk;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# ---------------------------------------------------------------------------
# Runs ONLY the Information Desk app.
#
# There is deliberately no postgres service here: the portal connects to your
# existing PostgreSQL server. Point DATABASE_URL at it and make sure the
# container can reach it.
#
#   docker compose --env-file ../.env.production up -d --build
#   docker compose exec app npm run migrate -w server
#   docker compose exec app npm run create-admin -w server -- --username alice
# ---------------------------------------------------------------------------

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: information-desk:latest
    container_name: information-desk
    restart: unless-stopped
    ports:
      - '127.0.0.1:4000:4000'
    environment:
      NODE_ENV: production
      PORT: '4000'
      APP_ORIGIN: ${APP_ORIGIN:?set APP_ORIGIN, e.g. https://desk.example.org}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL for your existing PostgreSQL server}
      PGSSLMODE: ${PGSSLMODE:-}
      JWT_SECRET: ${JWT_SECRET:?generate one with: openssl rand -base64 48}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      SESSION_HOURS: ${SESSION_HOURS:-8}
      ORG_NAME: ${ORG_NAME:-Information Desk}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-servicedesk@example.org}
      SUPPORT_PHONE: ${SUPPORT_PHONE:-}
    # The database usually lives on the host or elsewhere on the network.
    # On Linux, host.docker.internal needs this mapping to resolve.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

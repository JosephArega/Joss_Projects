<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Automation Unlocked - Horizontal Lockup</title>
<meta name="hz:slide-selector" content=".lockup" />
<meta name="hz:canvas-width" content="1600" />
<meta name="hz:canvas-height" content="440" />
<link rel="stylesheet" href="poppins-embed.css">
<style>
  * { margin:0; padding:0; box-sizing: border-box; }
  .lockup {
    position: relative;
    width: 1600px;
    height: 440px;
    background: transparent;
    overflow: hidden;
    display: flex;
    align-items: center;
  }
  .icon-wrap { position:absolute; left: 60px; top: 50%; transform: translateY(-50%); }
  .wordmark {
    position: absolute;
    left: 420px;
    top: 50%;
    transform: translateY(-50%);
    font-family: "poppins", sans-serif;
    font-weight: 700;
    font-size: 96px;
    letter-spacing: -1px;
    white-space: nowrap;
    color: #F5F7FA;
  }
  .wordmark .accent {
    background: linear-gradient(90deg, #3B82F6, #8B5CF6);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .tagline {
    position:absolute;
    left: 424px;
    top: 302px;
    font-family: "poppins", sans-serif;
    font-weight: 500;
    font-size: 30px;
    letter-spacing: 2px;
    color: #22D3EE;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="lockup" data-canvas-width="1600" data-canvas-height="440">
  <div class="icon-wrap">
    <svg width="340" height="340" viewBox="0 0 480 480" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="lockGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#3B82F6"/>
          <stop offset="100%" stop-color="#8B5CF6"/>
        </linearGradient>
        <linearGradient id="shackleGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#3B82F6"/>
          <stop offset="100%" stop-color="#8B5CF6"/>
        </linearGradient>
        <filter id="glow2" x="-80%" y="-80%" width="260%" height="260%">
          <feGaussianBlur stdDeviation="10" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>
      <rect x="8" y="8" width="464" height="464" rx="96" fill="#0F1522" stroke="url(#shackleGrad2)" stroke-opacity="0.4" stroke-width="3"/>
      <g transform="translate(0,2)">
        <path d="M 172,235 L172,168 A68,68 0 0 1 308,168 L308,210"
              fill="none" stroke="url(#shackleGrad2)" stroke-width="36"
              stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="130" y="228" width="220" height="172" rx="34" fill="url(#lockGrad2)"/>
        <circle cx="240" cy="300" r="16" fill="#0F1522"/>
        <rect x="231" y="304" width="18" height="42" rx="8" fill="#0F1522"/>
        <polygon points="316,150 372,150 322,232 358,232 274,352 302,250 262,250"
                 fill="#22D3EE" filter="url(#glow2)"/>
      </g>
    </svg>
  </div>
  <div class="wordmark">Automation <span class="accent">Unlocked</span></div>
  <div class="tagline">AI Automation &middot; Workflows &middot; Tutorials</div>
</div>
</body>
</html>

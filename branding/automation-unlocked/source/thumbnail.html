<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Automation Unlocked - Thumbnail Template</title>
<meta name="hz:slide-selector" content=".thumb" />
<meta name="hz:canvas-width" content="1280" />
<meta name="hz:canvas-height" content="720" />
<link rel="stylesheet" href="poppins-embed.css">
<style>
  * { margin:0; padding:0; box-sizing: border-box; }
  .thumb {
    position: relative;
    width: 1280px;
    height: 720px;
    background:
      radial-gradient(circle at 88% 8%, rgba(139,92,246,0.30) 0%, rgba(139,92,246,0) 42%),
      radial-gradient(circle at 6% 92%, rgba(59,130,246,0.24) 0%, rgba(59,130,246,0) 45%),
      #0B0F1A;
    overflow: hidden;
  }
  .accent-bar {
    position: absolute;
    width: 900px;
    height: 220px;
    left: -260px;
    top: 500px;
    background: linear-gradient(90deg, #3B82F6, #8B5CF6);
    opacity: 0.22;
    transform: rotate(-9deg);
    filter: blur(2px);
  }
  .headline {
    position: absolute;
    left: 72px;
    top: 160px;
    width: 980px;
    font-family: "Poppins", sans-serif;
    font-weight: 700;
    font-size: 108px;
    line-height: 1.08;
    letter-spacing: -1px;
    color: #F5F7FA;
  }
  .headline .accent {
    background: linear-gradient(90deg, #22D3EE, #3B82F6);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .brand {
    position: absolute;
    right: 56px;
    bottom: 40px;
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .brand .name {
    font-family: "Poppins", sans-serif;
    font-weight: 600;
    font-size: 30px;
    color: #F5F7FA;
  }
  .placeholder-note {
    position: absolute;
    left: 72px;
    bottom: 40px;
    font-family: "Poppins", sans-serif;
    font-weight: 500;
    font-size: 22px;
    color: #22D3EE;
    opacity: 0.75;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
<div class="thumb" data-canvas-width="1280" data-canvas-height="720">
  <div class="accent-bar"></div>

  <svg width="1280" height="720" style="position:absolute;top:0;left:0;">
    <g stroke="#22D3EE" stroke-width="2" opacity="0.14" fill="none">
      <path d="M1180,40 L1180,100 L1230,100"/>
      <circle cx="1230" cy="100" r="4" fill="#22D3EE"/>
      <path d="M1150,70 L1150,40 L1120,40"/>
      <circle cx="1150" cy="70" r="4" fill="#22D3EE"/>
    </g>
  </svg>

  <div class="headline">5 AI Automations<br/>You <span class="accent">Need</span></div>

  <div class="placeholder-note">HEADLINE TEMPLATE &middot; MAX 4-5 WORDS</div>

  <div class="brand">
    <svg width="64" height="64" viewBox="0 0 480 480" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="lockGradT" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#3B82F6"/>
          <stop offset="100%" stop-color="#8B5CF6"/>
        </linearGradient>
        <linearGradient id="shackleGradT" x1="0%" y1="100%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#3B82F6"/>
          <stop offset="100%" stop-color="#8B5CF6"/>
        </linearGradient>
      </defs>
      <rect x="8" y="8" width="464" height="464" rx="96" fill="#0F1522" stroke="url(#shackleGradT)" stroke-opacity="0.4" stroke-width="3"/>
      <path d="M 172,235 L172,168 A68,68 0 0 1 308,168 L308,210"
            fill="none" stroke="url(#shackleGradT)" stroke-width="36"
            stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="130" y="228" width="220" height="172" rx="34" fill="url(#lockGradT)"/>
      <circle cx="240" cy="300" r="16" fill="#0F1522"/>
      <rect x="231" y="304" width="18" height="42" rx="8" fill="#0F1522"/>
      <polygon points="316,150 372,150 322,232 358,232 274,352 302,250 262,250" fill="#22D3EE"/>
    </svg>
    <div class="name">Automation Unlocked</div>
  </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Automation Unlocked - Channel Icon</title>
<meta name="hz:slide-selector" content=".badge" />
<meta name="hz:canvas-width" content="800" />
<meta name="hz:canvas-height" content="800" />
<link rel="stylesheet" href="poppins-embed.css">
<style>
  * { margin:0; padding:0; box-sizing: border-box; }
  html,body { background:#0B0F1A; }
  .badge {
    position: relative;
    width: 800px;
    height: 800px;
    background:
      radial-gradient(circle at 30% 25%, rgba(59,130,246,0.35) 0%, rgba(59,130,246,0) 45%),
      radial-gradient(circle at 75% 80%, rgba(139,92,246,0.30) 0%, rgba(139,92,246,0) 50%),
      #0B0F1A;
    overflow: hidden;
  }
</style>
</head>
<body>
<div class="badge" data-canvas-width="800" data-canvas-height="800">
  <svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="lockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#3B82F6"/>
        <stop offset="100%" stop-color="#8B5CF6"/>
      </linearGradient>
      <linearGradient id="shackleGrad" x1="0%" y1="100%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#3B82F6"/>
        <stop offset="100%" stop-color="#8B5CF6"/>
      </linearGradient>
      <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
        <feGaussianBlur stdDeviation="14" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
      <radialGradient id="ringGrad" cx="50%" cy="50%" r="50%">
        <stop offset="88%" stop-color="#0B0F1A" stop-opacity="0"/>
        <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.35"/>
      </radialGradient>
    </defs>

    <!-- subtle circuit / node pattern, low opacity, corners only -->
    <g stroke="#22D3EE" stroke-width="2" opacity="0.16" fill="none">
      <path d="M40,120 L40,60 L100,60"/>
      <circle cx="100" cy="60" r="5" fill="#22D3EE"/>
      <path d="M60,180 L110,180 L110,140"/>
      <circle cx="60" cy="180" r="4" fill="#22D3EE"/>
      <path d="M760,660 L760,720 L700,720"/>
      <circle cx="700" cy="720" r="5" fill="#22D3EE"/>
      <path d="M740,600 L690,600 L690,640"/>
      <circle cx="740" cy="600" r="4" fill="#22D3EE"/>
    </g>

    <!-- soft badge ring -->
    <circle cx="400" cy="400" r="340" fill="none" stroke="url(#shackleGrad)" stroke-opacity="0.18" stroke-width="3"/>

    <!-- icon group, local space 0..480 translated to center -->
    <g transform="translate(160,150)">
      <!-- shackle: open on right, flowing into bolt -->
      <path d="M 172,235 L172,168 A68,68 0 0 1 308,168 L308,210"
            fill="none" stroke="url(#shackleGrad)" stroke-width="36"
            stroke-linecap="round" stroke-linejoin="round"/>

      <!-- lock body -->
      <rect x="130" y="228" width="220" height="172" rx="34" fill="url(#lockGrad)"/>

      <!-- keyhole cutout -->
      <circle cx="240" cy="300" r="16" fill="#0B0F1A"/>
      <rect x="231" y="304" width="18" height="42" rx="8" fill="#0B0F1A"/>

      <!-- lightning bolt erupting from open shackle end -->
      <polygon points="316,150 372,150 322,232 358,232 274,352 302,250 262,250"
               fill="#22D3EE" filter="url(#glow)"/>
    </g>

    <circle cx="400" cy="400" r="398" fill="none" stroke="url(#ringGrad)" stroke-width="4"/>
  </svg>
</div>
</body>
</html>
